# JunSi开发工具包 — DSH agent preset 组合模板
#
# 这是独立 preset 的 agent.cordis.yml 模板。把它放到你的 DSH 用户 preset 目录
#   ~/.dsh/.agent-presets/<id>/
# 并跟随下方「需按本机/仓库路径替换」的两处改成你的实际路径即可。
#
# 若你不想手建 preset，也可以：
#   1) 把本仓库 `plugins/` 三个 .mjs 复制进一个标准 preset + skills 用下面的
#      customSkillDirs 指向本仓库的 `skills/` 目录。
#   2) 或仅把 `skills/` 挂进你已有 preset 的 customSkillDirs。
#
# plane 规则：发布服务的行必须放进带 isolate realm 的 group 内。下面所有行
# 要么不发布服务（tool/consumer 行，仅注册进 host 的 tools/skills/systemPrompt
# 注册表），要么是官方包（不提供服务），因此都无需 realm。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working
      directory is {{cwd}}. You carry the JunSi 开发工具包 (junsi-dev-toolkit):
      route requests to the right sub-skill, keep decisions/progress in .memory/,
      and follow the task-completion checklist. Before starting, check whether the
      remote repo already implements/fixes the user's request.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell / filesystem / jobs ───────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
#
# ★ 需按本机替换：把下面的路径指向你 clone 本仓库后的 `skills/` 目录。
#   (customSkillDirs 用绝对路径；相对路径按 DSH 进程的 cwd 解析，不是此 preset 目录)
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - 'C:/REPLACE-WITH-PATH-TO/this-repo/skills'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals / plan / compaction ───────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement does not end plan mode; fold confirmed decisions into the plan and submit through exit_plan_mode.
          Explore first with non-mutating reads. Do not edit files, change config, commit, or carry out the plan.
          Resolve discoverable facts by inspection; use ask_user_question only for user-owned choices.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config: { provider: spawn, toolName: subagent, backgroundMode: continuable }
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config: { provider: fork, toolName: subagent_fork, backgroundMode: continuable }
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config: { provider: spawn }
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config: { subagentProvider: spawn, maxRounds: 64 }

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config: { allowParallelInProgress: true }
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config: { fetch: false, searchTimeoutMs: 60000 }

# ── junsi-dev-toolkit: scheduled reminders (cron) ───────────────────────────

- id: schedule
  name: '@deepseek-ai/dsh-schedule'

# ── junsi-dev-toolkit: custom local plugins (relative to preset dir) ────────

- id: memory-tools
  name: './plugins/memory-tools.mjs'
  config: {}
- id: tool-search
  name: './plugins/tool-search.mjs'
  config: {}
- id: routing
  name: './plugins/routing.mjs'
  config: {}

# ── junsi-dev-toolkit: MCP servers ──────────────────────────────────────────
#
# ★ 需按本机替换：mcp-server.py 路径改成你 clone 本仓库后的绝对路径。
#   (这里用 DSH_HOME/.agent-presets 作为示例预设落点；若你用别处，改这一行)
- id: mcp-project-docs
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: project-docs
    transport: stdio
    command: python
    args:
      - !!js 'process.env.DSH_HOME + "/.agent-presets/junsi-dev-toolkit/mcp/project-docs/mcp-server.py"'
    env:
      PYTHONUNBUFFERED: '1'

- id: mcp-playwright
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: playwright
    transport: stdio
    command: npx
    args:
      - '@playwright/mcp@latest'
